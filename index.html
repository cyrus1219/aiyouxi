<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沉浸式文字冒险</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 开始界面 -->
  <div id="screen-start" class="screen active">
    <div class="title-card">
      <h1 id="game-title">游戏标题</h1>
      <p id="game-subtitle">副标题 / 世界观一句话简介</p>
      <button id="btn-start" onclick="startGame()">开始冒险</button>
    </div>
  </div>

  <!-- 角色创建 -->
  <div id="screen-create" class="screen">
    <div class="panel">
      <h2>创建角色</h2>
      <div class="input-group">
        <label>角色名</label>
        <input type="text" id="player-name" placeholder="输入你的名字" maxlength="12">
      </div>
      <div class="attr-allocate">
        <p>分配属性点 <span id="points-left">10</span> 点剩余</p>
        <div id="attr-list"></div>
      </div>
      <button id="btn-confirm" onclick="confirmCreate()">确认出发</button>
    </div>
  </div>

  <!-- 主游戏界面 -->
  <div id="screen-game" class="screen">
    <div id="sidebar">
      <div id="player-info">
        <div id="player-name-display"></div>
        <div id="attr-display"></div>
      </div>
      <div id="history-log">
        <div id="log-title">历史记录</div>
        <div id="log-content"></div>
      </div>
    </div>
    <div id="main-area">
      <div id="story-box">
        <div id="story-text"></div>
      </div>
      <div id="options-box"></div>
      <div id="loading" class="hidden">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- 结局界面 -->
  <div id="screen-end" class="screen">
    <div class="panel">
      <h2 id="end-title">故事终章</h2>
      <p id="end-text"></p>
      <button onclick="location.reload()">重新开始</button>
    </div>
  </div>

  <script src="story.js"></script>
  <script src="ai.js"></script>
  <script src="game.js"></script>
</body>
</html>
